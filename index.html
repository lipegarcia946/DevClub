<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
    <title>Gasto na Foto</title>
</head>

<body>
    <div>
        <h1>📸 Gasto na Foto</h1>
        <p class="topo">Fotografe o comprovante. A IA anota pra você.</p>
    </div>

    <div class="caixa-total">
        <p>Total gasto</p>
        <h2 class="total-gasto">R$ 0,00</h2>
        <p>0 comprovantes lidos</p>
    </div>

    <label>
        🧾 Toque para fotografar o comprovante <input class="foto" onchange="lerFoto()" type="file" accept="image/*">
    </label>

    <!-- Área onde os comprovantes serão exibidos -->
    <div class="lista"></div>

    <!-- Carregar Puter.js e seu JavaScript -->
    <script src="https://js.puter.com/v2/"></script>
    <script src="scripts.js"></script>
</body>

</html>
